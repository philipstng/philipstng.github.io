<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhilCo | Small apps, built with care</title>
<meta name="description" content="PhilCo is an independent Android developer making simple, focused apps.">
<meta name="theme-color" content="#f7f4ee">
<style>
  :root {
    --bg: #f7f4ee;
    --text: #1a1a1a;
    --muted: #6e6a62;
    --line: #dcd7cc;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    padding: 0 28px;
  }
  header { padding: 28px 0; font-family: var(--serif); font-size: 1.5rem; letter-spacing: -.01em; }

  main {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    max-width: 900px; width: 100%; margin: 0 auto 6vh;
  }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(3rem, 10vw, 7rem);
    line-height: 1; letter-spacing: -.035em;
    animation: rise 1s ease both;
  }
  p {
    margin-top: 32px; font-size: 1.2rem; color: var(--muted); max-width: 440px;
    animation: rise 1s .15s ease both;
  }
  .pill {
    align-self: flex-start; margin-top: 44px;
    padding: 14px 28px; border-radius: 999px;
    background: var(--text); color: var(--bg);
    font-size: .95rem; font-weight: 500;
    animation: rise 1s .3s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  footer {
    border-top: 1px solid var(--line); padding: 24px 0 32px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    font-size: .85rem; color: var(--muted);
  }
  footer a { color: inherit; text-underline-offset: 3px; }
  footer a:hover { color: var(--text); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <header>PhilCo</header>

  <main>
    <h1>Small apps,<br>built with care.</h1>
    <p>An independent Android studio making simple, focused tools that do one thing well.</p>
    <a href="https://play.google.com/store/apps/details?id=com.ferbersleeptimer.babytracker&pcampaignid=web_share"><span class="pill">Ferber Timer, Google Play</span></a>
  </main>

  <footer>
    <span>© 2026 PhilCo</span>
    <a href="https://philipstng.github.io/Ferber-Timer-Privacy-Policy/">Privacy Policy</a>
  </footer>
</body>
</html>
